<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Andover · Sticky header</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 0; }
  .card-stage { padding: 24px; }
  .header {
    background: rgba(250,248,243,0.72);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(231,224,210,0.6);
    border-radius: 999px;
    padding: 10px 12px 10px 22px;
    display: flex; align-items: center; gap: 18px;
    box-shadow: var(--shadow-sm);
  }
  .logo { font-family: var(--font-display); font-weight: 500; font-variation-settings: 'opsz' 144, 'SOFT' 50; font-size: 18px; letter-spacing: 0.04em; color: var(--granate-ink); }
  .logo small { font-family: var(--font-mono); font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-soft); display: block; line-height: 1; margin-top: 2px; }
  nav { display: flex; gap: 18px; font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--ink); margin-left: auto; }
  nav a { color: inherit; text-decoration: none; opacity: 0.8; }
  nav a.active { color: var(--granate); opacity: 1; }
  .cta {
    background: var(--granate); color: var(--bone);
    padding: 10px 18px; border-radius: 999px;
    font-family: var(--font-body); font-size: 13px; font-weight: 600;
    border: none; cursor: pointer;
    box-shadow: var(--glow-granate);
  }
</style>
</head>
<body>
<div class="card-stage">
  <header class="header">
    <span class="logo">ANDOVER<small>Comedores y Limpiezas</small></span>
    <nav>
      <a class="active">Inicio</a>
      <a>Servicios</a>
      <a>Método</a>
      <a>Zonas</a>
      <a>Contacto</a>
    </nav>
    <button class="cta">Solicitar información →</button>
  </header>
</div>
</body>
</html>
