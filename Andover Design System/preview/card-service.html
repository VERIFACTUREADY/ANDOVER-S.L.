<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Andover · Service card</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .card {
    background: var(--bone);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: 22px 22px 20px;
    box-shadow: var(--shadow-md);
    display: flex; flex-direction: column; gap: 14px;
    min-height: 200px;
    position: relative;
    overflow: hidden;
  }
  .card.hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
  .num { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em; color: var(--granate); }
  h3 { font-family: var(--font-display); font-weight: 500; font-variation-settings: 'opsz' 144, 'SOFT' 50; font-size: 24px; color: var(--granate-ink); margin: 0; letter-spacing: -0.015em; line-height: 1.1; }
  p { font-family: var(--font-body); font-size: 13px; color: var(--ink-soft); line-height: 1.5; margin: 0; }
  .more { font-family: var(--font-mono); font-size: 11px; color: var(--granate); margin-top: auto; letter-spacing: 0.04em; }
  .glyph { position: absolute; top: 18px; right: 18px; width: 36px; height: 36px; border-radius: 50%; background: var(--granate-tint); display: grid; place-items: center; color: var(--granate); }
</style>
</head>
<body>
<div class="card-stage">
  <div class="row">
    <article class="card">
      <span class="glyph"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16"/><path d="M6 11v8h12v-8"/><circle cx="12" cy="6" r="2"/></svg></span>
      <span class="num">01 · Servicio</span>
      <h3>Gestión de comedores</h3>
      <p>Coordinamos el día a día del comedor para que el centro funcione sin sobresaltos.</p>
      <span class="more">Ver más →</span>
    </article>
    <article class="card hover">
      <span class="glyph" style="background:var(--verde-tint); color:var(--verde-deep);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C12 12 2 12 12 22C22 12 12 12 12 2Z"/></svg></span>
      <span class="num" style="color:var(--verde-deep);">02 · Servicio</span>
      <h3>Limpieza profesional</h3>
      <p>Espacios cuidados, protocolos claros y continuidad operativa garantizada.</p>
      <span class="more" style="color:var(--verde-deep);">Ver más →</span>
    </article>
  </div>
</div>
</body>
</html>
