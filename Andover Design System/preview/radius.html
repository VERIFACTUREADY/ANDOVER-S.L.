<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Andover · Radius</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .shape { width: 76px; height: 76px; background: var(--granate); border: 6px solid #4A111A; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--ink-soft); letter-spacing: 0; text-align: center; }
  .nm { color: var(--granate); font-weight: 500; }
</style>
</head>
<body>
<div class="card-stage">
  <div class="row">
    <div class="item"><div class="shape" style="border-radius:8px;"></div><span class="lbl"><span class="nm">sm</span><br>8px</span></div>
    <div class="item"><div class="shape" style="border-radius:12px;"></div><span class="lbl"><span class="nm">md</span><br>12px · inputs</span></div>
    <div class="item"><div class="shape" style="border-radius:20px;"></div><span class="lbl"><span class="nm">lg</span><br>20px · cards</span></div>
    <div class="item"><div class="shape" style="border-radius:28px;"></div><span class="lbl"><span class="nm">xl</span><br>28px · media</span></div>
    <div class="item"><div class="shape" style="border-radius:40px;"></div><span class="lbl"><span class="nm">2xl</span><br>40px · panels</span></div>
    <div class="item"><div class="shape" style="border-radius:999px;"></div><span class="lbl"><span class="nm">pill</span><br>buttons</span></div>
  </div>
</div>
</body>
</html>
