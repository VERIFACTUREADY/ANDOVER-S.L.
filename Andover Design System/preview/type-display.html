<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Andover · Display type</title>
<link rel="stylesheet" href="_card.css">
<style>
  .stage { padding: 28px 24px; background: var(--cream); border-radius: var(--radius-lg); }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--granate); margin-bottom: 14px; }
  .display { font-family: var(--font-display); font-weight: 500; font-variation-settings: 'opsz' 144, 'SOFT' 50; color: var(--granate-ink); letter-spacing: -0.022em; line-height: 0.98; font-size: 64px; margin: 0 0 12px; }
  .display em { font-style: italic; color: var(--granate); }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--ink-soft); letter-spacing: 0; }
</style>
</head>
<body>
<div class="card-stage">
  <div class="stage">
    <div class="eyebrow">Display · Fraunces 500</div>
    <h1 class="display">Centros más <em>tranquilos.</em></h1>
    <div class="meta">opsz 144 · SOFT 50 · tracking -0.022em · line-height 0.98</div>
  </div>
</div>
</body>
</html>
