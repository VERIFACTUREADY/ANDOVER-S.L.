<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Andover · Color pairings</title>
<link rel="stylesheet" href="_card.css">
<style>
  .pairs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .pair {
    border-radius: var(--radius-md);
    padding: 18px;
    min-height: 130px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .pair .label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; }
  .pair .demo { font-family: var(--font-display); font-size: 28px; font-weight: 500; line-height: 1; font-variation-settings: 'opsz' 144, 'SOFT' 50; }
</style>
</head>
<body>
<div class="card-stage">
  <div class="pairs">
    <div class="pair" style="background:#F6F1E8;">
      <span class="label" style="color:#7A1F2B;">Default</span>
      <span class="demo" style="color:#2A0A10;">Comedor</span>
      <span class="label" style="color:#6E6A64;">Cream + ink</span>
    </div>
    <div class="pair" style="background:#7A1F2B;">
      <span class="label" style="color:#F6F1E8; opacity:0.7;">Premium</span>
      <span class="demo" style="color:#F6F1E8;">Tranquilo</span>
      <span class="label" style="color:#F6F1E8; opacity:0.7;">Granate + cream</span>
    </div>
    <div class="pair" style="background:#DDE9DF;">
      <span class="label" style="color:#1F4A36;">Trust</span>
      <span class="demo" style="color:#1F4A36;">Cuidado</span>
      <span class="label" style="color:#1F4A36;">Verde + verde-deep</span>
    </div>
  </div>
</div>
</body>
</html>
