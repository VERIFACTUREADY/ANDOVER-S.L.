<body>

  <script type="text/babel">
    const { useEffect, useState } = React;

    function ScrollProgress() {
      const [p, setP] = useState(0);
      useEffect(() => {
        const onScroll = () => {
          const h = document.documentElement;
          const max = h.scrollHeight - h.clientHeight;
          setP(max > 0 ? (h.scrollTop / max) * 100 : 0);
        };
        onScroll();
        window.addEventListener("scroll", onScroll, { passive: true });
        window.addEventListener("resize", onScroll);
        return () => {
          window.removeEventListener("scroll", onScroll);
          window.removeEventListener("resize", onScroll);
        };
      }, []);
      return (
        <div className="scroll-progress" aria-hidden="true">
          <div className="scroll-progress-bar" style={{ width: `${p}%` }} />
        </div>
      );
    }

    // Split section h2 text into <span class="word"> for staggered word reveal.
    function splitHeadingWords() {
      document.querySelectorAll(".section-head h2").forEach(h2 => {
        if (h2.dataset.split === "1") return;
        const html = h2.innerHTML;
        // Preserve <br>, <em>, etc. — split only top-level text by whitespace
        const tmp = document.createElement("div");
        tmp.innerHTML = html;
        const walk = (node) => {
          if (node.nodeType === 3) {
            const frag = document.createDocumentFragment();
            const parts = node.textContent.split(/(\s+)/);
            parts.forEach(p => {
              if (/^\s+$/.test(p)) {
                frag.appendChild(document.createTextNode(p));
              } else if (p.length) {
                const s = document.createElement("span");
                s.className = "word";
                s.textContent = p;
                frag.appendChild(s);
              }
            });
            node.parentNode.replaceChild(frag, node);
          } else if (node.nodeType === 1 && node.tagName !== "SPAN") {
            // Recurse into <em>, <br> handled by skipping
            Array.from(node.childNodes).forEach(walk);
          }
        };
        Array.from(tmp.childNodes).forEach(walk);
        h2.innerHTML = tmp.innerHTML;
        h2.dataset.split = "1";
      });
    }

    // Count-up the hero number from 0 → target when it enters the viewport.
    function setupCountUp() {
      const els = document.querySelectorAll("[data-countup]");
      const io = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (!e.isIntersecting) return;
          const el = e.target;
          if (el.dataset.countupDone === "1") return;
          el.dataset.countupDone = "1";
          const target = parseInt(el.dataset.countup, 10);
          const duration = 1400;
          const start = performance.now();
          const tick = (now) => {
            const t = Math.min(1, (now - start) / duration);
            const eased = 1 - Math.pow(1 - t, 3);
            el.textContent = Math.round(target * eased);
            if (t < 1) requestAnimationFrame(tick);
            else el.textContent = String(target);
          };
          requestAnimationFrame(tick);
        });
      }, { threshold: 0.4 });
      els.forEach(el => io.observe(el));
    }

    function App() {
      useEffect(() => {
        // Reveal animations
        const io = new IntersectionObserver(entries => {
          entries.forEach(e => {
            if (e.isIntersecting) {
              e.target.classList.add("in");
              io.unobserve(e.target);
            }
          });
        }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });

        // Split headings BEFORE observing
        splitHeadingWords();
        document.querySelectorAll(".reveal, .reveal-stagger").forEach(el => io.observe(el));

        // Count-up numbers
        setupCountUp();

        return () => io.disconnect();
      }, []);

      return (
        <>
          <ScrollProgress />
          <Header />
          <main>
            <Hero />
            <ServicesGrid />
            <Pillars />
            <ServicesDetail />
            <Method />
            <ChaosToOrder />
            <Audience />
            <Zones />
            <Gallery />
            <Contact />
          </main>
          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("app")).render(<App />);
  </script>
