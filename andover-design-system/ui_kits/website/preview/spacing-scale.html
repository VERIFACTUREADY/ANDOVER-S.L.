<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Andover · Spacing</title>
<link rel="stylesheet" href="_card.css">
<style>
  .scale { display: flex; align-items: flex-end; gap: 14px; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--granate); border-radius: 4px; width: 28px; }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--ink-soft); letter-spacing: 0; }
  .num { font-family: var(--font-mono); font-size: 11px; color: var(--granate); font-weight: 500; }
</style>
</head>
<body>
<div class="card-stage">
  <div class="scale">
    <div class="step"><div class="bar" style="height:4px;"></div><span class="num">4</span><span class="tag">s-1</span></div>
    <div class="step"><div class="bar" style="height:8px;"></div><span class="num">8</span><span class="tag">s-2</span></div>
    <div class="step"><div class="bar" style="height:12px;"></div><span class="num">12</span><span class="tag">s-3</span></div>
    <div class="step"><div class="bar" style="height:16px;"></div><span class="num">16</span><span class="tag">s-4</span></div>
    <div class="step"><div class="bar" style="height:24px;"></div><span class="num">24</span><span class="tag">s-6</span></div>
    <div class="step"><div class="bar" style="height:32px;"></div><span class="num">32</span><span class="tag">s-7</span></div>
    <div class="step"><div class="bar" style="height:48px;"></div><span class="num">48</span><span class="tag">s-9</span></div>
    <div class="step"><div class="bar" style="height:64px;"></div><span class="num">64</span><span class="tag">s-10</span></div>
    <div class="step"><div class="bar" style="height:96px;"></div><span class="num">96</span><span class="tag">s-12</span></div>
    <div class="step"><div class="bar" style="height:128px;"></div><span class="num">128</span><span class="tag">s-16</span></div>
  </div>
</div>
</body>
</html>
