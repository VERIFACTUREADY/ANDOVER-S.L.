<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Andover · Testimonial</title>
<link rel="stylesheet" href="_card.css">
<style>
  .quote {
    background: var(--granate-ink); color: var(--cream);
    border-radius: var(--radius-lg);
    padding: 26px 28px;
    position: relative;
    box-shadow: var(--shadow-lg);
  }
  .mark { position: absolute; top: 14px; right: 22px; font-family: var(--font-display); font-size: 64px; color: rgba(246,241,232,0.15); line-height: 1; }
  blockquote { font-family: var(--font-display); font-variation-settings: 'opsz' 144, 'SOFT' 50; font-style: italic; font-weight: 400; font-size: 20px; line-height: 1.35; margin: 0 0 22px; color: var(--cream); max-width: 88%; letter-spacing: -0.01em; }
  .who { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--granate); display: grid; place-items: center; font-family: var(--font-display); font-weight: 500; color: var(--cream); }
  .name { font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--cream); }
  .role { font-family: var(--font-mono); font-size: 10px; color: rgba(246,241,232,0.6); letter-spacing: 0.12em; text-transform: uppercase; }
  .ph { color: rgba(246,241,232,0.5); font-style: normal; font-family: var(--font-mono); font-size: 11px; }
</style>
</head>
<body>
<div class="card-stage">
  <div class="quote">
    <span class="mark">”</span>
    <blockquote>La tranquilidad de saber que siempre hay alguien al otro lado. <span class="ph">[testimonio real pendiente]</span></blockquote>
    <div class="who">
      <div class="avatar">M</div>
      <div>
        <div class="name">[Nombre · Cargo]</div>
        <div class="role">[Colegio · Madrid]</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
