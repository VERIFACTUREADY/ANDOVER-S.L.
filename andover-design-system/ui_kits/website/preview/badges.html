<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Andover · Badges & chips</title>
<link rel="stylesheet" href="_card.css">
<style>
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 999px;
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .b-granate { background: var(--granate-tint); color: var(--granate-deep); }
  .b-verde   { background: var(--verde-tint); color: var(--verde-deep); }
  .b-cream   { background: var(--cream); color: var(--ink); border: 1px solid var(--line); }
  .b-deep    { background: var(--granate-ink); color: var(--cream); }
  .b-dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-radius: 999px;
    background: var(--bone); border: 1px solid var(--line-strong);
    font-family: var(--font-body); font-size: 13px; font-weight: 500; color: var(--ink);
  }
  .chip-active { background: var(--granate); color: var(--bone); border-color: transparent; }
  .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); width: 80px; }
</style>
</head>
<body>
<div class="card-stage">
  <div class="stack">
    <div class="row"><span class="lbl">Badges</span>
      <span class="badge b-granate b-dot">Madrid</span>
      <span class="badge b-verde b-dot">Servicio activo</span>
      <span class="badge b-cream">Colegio</span>
      <span class="badge b-deep">Andover · 2026</span>
    </div>
    <div class="row"><span class="lbl">Chips</span>
      <button class="chip chip-active">Colegios</button>
      <button class="chip">Empresas</button>
      <button class="chip">Centros</button>
      <button class="chip">Colectividades</button>
    </div>
  </div>
</div>
</body>
</html>
