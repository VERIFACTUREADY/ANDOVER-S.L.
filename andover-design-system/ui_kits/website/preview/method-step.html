<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Andover · Method step / timeline node</title>
<link rel="stylesheet" href="_card.css">
<style>
  .timeline { position: relative; padding-left: 36px; }
  .timeline::before {
    content: ""; position: absolute; left: 14px; top: 8px; bottom: 8px;
    width: 1px; background: linear-gradient(var(--granate), var(--verde));
  }
  .step { position: relative; padding-bottom: 18px; }
  .step:last-child { padding-bottom: 0; }
  .dot {
    position: absolute; left: -36px; top: 4px;
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--bone); border: 1px solid var(--line-strong);
    display: grid; place-items: center;
    font-family: var(--font-mono); font-size: 10px; color: var(--granate); font-weight: 500;
  }
  .dot.active { background: var(--granate); color: var(--bone); border-color: var(--granate); box-shadow: var(--glow-granate); }
  .dot.done   { background: var(--verde); color: var(--bone); border-color: var(--verde); }
  h4 { font-family: var(--font-body); font-size: 15px; font-weight: 600; color: var(--ink); margin: 0 0 4px; letter-spacing: -0.005em; }
  p { font-family: var(--font-body); font-size: 13px; color: var(--ink-soft); margin: 0; line-height: 1.5; }
</style>
</head>
<body>
<div class="card-stage">
  <div class="timeline">
    <div class="step">
      <span class="dot done">✓</span>
      <h4>Escuchamos las necesidades del centro</h4>
      <p>Visita, conversación, identificación de prioridades reales.</p>
    </div>
    <div class="step">
      <span class="dot active">02</span>
      <h4>Diseñamos una propuesta personalizada</h4>
      <p>Cada colegio es distinto. La propuesta también.</p>
    </div>
    <div class="step">
      <span class="dot">03</span>
      <h4>Coordinamos comedor, limpieza y equipo</h4>
      <p>Una misma visión, un único interlocutor.</p>
    </div>
  </div>
</div>
</body>
</html>
