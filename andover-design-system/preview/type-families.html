<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Andover · Type families</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .fam {
    padding: 18px;
    background: var(--bone);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    min-height: 140px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .ex { line-height: 1; color: var(--granate-ink); }
  .fa { font-family: var(--font-display); font-size: 42px; font-weight: 500; font-variation-settings: 'opsz' 144, 'SOFT' 50; letter-spacing: -0.02em; }
  .fb { font-family: var(--font-body); font-size: 32px; font-weight: 600; letter-spacing: -0.01em; }
  .fm { font-family: var(--font-mono); font-size: 22px; font-weight: 500; letter-spacing: 0.04em; color: var(--granate); }
  .meta { font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); }
  .name { font-family: var(--font-body); font-weight: 600; font-size: 13px; color: var(--ink); }
</style>
</head>
<body>
<div class="card-stage">
  <div class="row">
    <div class="fam">
      <span class="ex fa">Aa Áé</span>
      <div>
        <div class="name">Fraunces</div>
        <div class="meta">Display · 400 / 500 / 600</div>
      </div>
    </div>
    <div class="fam">
      <span class="ex fb">Aa Áé</span>
      <div>
        <div class="name">Plus Jakarta Sans</div>
        <div class="meta">Body · 400 / 500 / 600 / 700</div>
      </div>
    </div>
    <div class="fam">
      <span class="ex fm">01 · /</span>
      <div>
        <div class="name">JetBrains Mono</div>
        <div class="meta">Tag · 400 / 500</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
