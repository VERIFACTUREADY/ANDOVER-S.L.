<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Andover · Shadows</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; padding: 24px 8px 8px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box {
    width: 90px; height: 70px;
    background: var(--bone);
    border-radius: var(--radius-md);
    border: 1px solid var(--line);
  }
  .b-sm { box-shadow: var(--shadow-sm); }
  .b-md { box-shadow: var(--shadow-md); }
  .b-lg { box-shadow: var(--shadow-lg); }
  .b-xl { box-shadow: var(--shadow-xl); }
  .b-glow { box-shadow: var(--glow-granate); }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--ink-soft); }
  .nm  { color: var(--granate); font-weight: 500; }
</style>
</head>
<body>
<div class="card-stage">
  <div class="row">
    <div class="item"><div class="box b-sm"></div><span class="lbl"><span class="nm">sm</span> · focus</span></div>
    <div class="item"><div class="box b-md"></div><span class="lbl"><span class="nm">md</span> · cards</span></div>
    <div class="item"><div class="box b-lg"></div><span class="lbl"><span class="nm">lg</span> · hover</span></div>
    <div class="item"><div class="box b-xl"></div><span class="lbl"><span class="nm">xl</span> · modal</span></div>
    <div class="item"><div class="box b-glow"></div><span class="lbl"><span class="nm">glow</span> · CTA</span></div>
  </div>
</div>
</body>
</html>
